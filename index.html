<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARSH FM — Retro FM Music Player</title>
    <meta name="description" content="DARSH FM — A retro skeuomorphic FM radio player featuring curated indie tracks.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* ── Hidden audio player engine ── */
        #yt-player-wrap {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 200px;
            height: 120px;
            opacity: 0.001; /* Active on-screen layer so browser media engine never throttles */
            pointer-events: none;
            z-index: -10;
        }

        /* ── Playlist tray ── slides in and out of the radio top slot ── */
        .playlist-tray {
            position: fixed;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%) translateY(calc(100% - 32px));
            width: min(480px, 94vw);
            max-width: calc(100vw - 20px);
            z-index: 10;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .playlist-tray.open {
            transform: translateX(-50%) translateY(0);
        }

        /* Radio sits in front so tray slides directly inside it */
        .scene {
            position: relative;
            z-index: 20;
        }

        /* Tray handle — stays docked on the radio top slot when closed */
        .tray-handle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            min-height: 34px;
            background: linear-gradient(180deg, #3d2a10 0%, #2a1d09 100%);
            border: 1px solid rgba(255, 160, 40, 0.25);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.2em;
            color: rgba(200, 140, 50, 0.85);
            user-select: none;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.3);
            transition: color 0.2s, background 0.2s;
            touch-action: manipulation;
        }

        .tray-handle:hover,
        .tray-handle:focus-visible {
            color: rgba(255, 190, 60, 1);
            background: linear-gradient(180deg, #483214 0%, #32230b 100%);
            outline: none;
        }

        .tray-arrow {
            display: inline-block;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .playlist-tray.open .tray-arrow {
            transform: rotate(180deg);
        }

        /* Scrollable song list — sits below handle, slides down into radio body */
        .tray-body {
            max-height: 260px;
            overflow-y: auto;
            background: linear-gradient(180deg, #201408 0%, #180f05 100%);
            border: 1px solid rgba(255, 160, 40, 0.18);
            border-top: none;
            border-radius: 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            -webkit-overflow-scrolling: touch;
        }

        .tray-body::-webkit-scrollbar {
            width: 4px;
        }

        .tray-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .tray-body::-webkit-scrollbar-thumb {
            background: rgba(255, 160, 40, 0.25);
            border-radius: 2px;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            min-height: 44px; /* Touch target size */
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 160, 40, 0.06);
            transition: background 0.15s;
            user-select: none;
            touch-action: manipulation;
        }

        .track-item:hover,
        .track-item:focus-visible {
            background: rgba(255, 160, 40, 0.08);
            outline: none;
        }

        .track-item.active {
            background: rgba(255, 160, 40, 0.12);
            border-left: 3px solid rgba(255, 160, 40, 0.65);
        }

        .track-num {
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            color: rgba(200, 130, 40, 0.45);
            width: 22px;
            flex-shrink: 0;
        }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: rgba(255, 180, 60, 0.85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            color: rgba(180, 120, 40, 0.55);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .track-play-icon {
            font-size: 10px;
            color: rgba(255, 160, 40, 0.5);
            flex-shrink: 0;
            width: 14px;
            text-align: center;
        }

        .track-item.active .track-play-icon {
            color: #ffb030;
        }

        /* ── Mini spinning CD disc ── */
        .cd-disc {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            position: relative;
            background:
                radial-gradient(circle at 50% 50%,
                    #1a1108 0%,
                    #1a1108 18%,
                    transparent 18%),
                conic-gradient(from 0deg,
                    rgba(255, 160, 40, 0.35),
                    rgba(200, 100, 20, 0.2),
                    rgba(255, 200, 80, 0.4),
                    rgba(180, 80, 10, 0.2),
                    rgba(255, 160, 40, 0.35)),
                radial-gradient(circle, #3a2810 0%, #1a0e04 100%);
            box-shadow:
                0 0 0 1px rgba(255, 160, 40, 0.15),
                inset 0 0 4px rgba(0, 0, 0, 0.6);
            transition: opacity 0.2s;
        }

        .cd-disc::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #0e0804;
            border: 1px solid rgba(255, 160, 40, 0.2);
            box-shadow: 0 0 3px rgba(255, 140, 20, 0.3);
        }

        .cd-disc::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 4px;
            width: 7px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 220, 120, 0.22);
            transform: rotate(-30deg);
            pointer-events: none;
        }

        .track-item.active .cd-disc {
            animation: cdSpin 3s linear infinite;
            box-shadow:
                0 0 0 1px rgba(255, 160, 40, 0.4),
                0 0 8px rgba(255, 140, 20, 0.25),
                inset 0 0 4px rgba(0, 0, 0, 0.5);
        }

        @keyframes cdSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* LCD List button placed right after the LCD display */
        .lcd-list-btn {
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            border-radius: 6px;
            margin: 0 4px 0 8px;
            padding: 6px 10px;
            min-height: 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            user-select: none;
            flex-shrink: 0;
            background: linear-gradient(180deg, #3d2a10 0%, #2a1c08 60%, #1c1305 100%);
            border: 1px solid rgba(255, 160, 40, 0.3);
            box-shadow:
                0 2px 0 rgba(0, 0, 0, 0.6),
                0 3px 6px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 180, 60, 0.2);
            color: rgba(255, 180, 60, 0.85);
            transition: transform 0.08s ease, box-shadow 0.08s ease, color 0.2s, background 0.2s, border-color 0.2s;
            touch-action: manipulation;
        }

        .lcd-list-btn:hover,
        .lcd-list-btn:focus-visible {
            color: #ffb830;
            border-color: rgba(255, 180, 40, 0.6);
            box-shadow:
                0 2px 0 rgba(0, 0, 0, 0.6),
                0 0 10px rgba(255, 160, 40, 0.3),
                inset 0 1px 0 rgba(255, 200, 80, 0.3);
            outline: none;
        }

        .lcd-list-btn.pressed,
        .lcd-list-btn:active {
            transform: translateY(2px);
            box-shadow:
                0 0 0 rgba(0, 0, 0, 0.6),
                0 1px 3px rgba(0, 0, 0, 0.4),
                inset 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .lcd-list-btn.active {
            background: linear-gradient(180deg, #5a3a08 0%, #3e2606 60%, #2b1a04 100%);
            color: #ffc040;
            border-color: rgba(255, 190, 60, 0.7);
            box-shadow:
                0 2px 0 rgba(0, 0, 0, 0.6),
                0 0 12px rgba(255, 160, 40, 0.4),
                inset 0 1px 0 rgba(255, 220, 100, 0.4);
        }

        .lcd-btn-icon {
            font-size: 11px;
            line-height: 1;
        }

        .lcd-btn-text {
            font-size: 8px;
            letter-spacing: 0.12em;
            font-weight: bold;
            line-height: 1;
        }

        /* List button in presets row */
        .list-btn {
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            border-radius: 4px;
            padding: 5px 10px;
            min-height: 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            user-select: none;
            transition: transform 0.08s ease, box-shadow 0.08s ease, color 0.2s;
            background: linear-gradient(180deg, #3a2810 0%, #2a1c08 55%, #1e1506 100%);
            border: 1px solid rgba(255, 160, 40, 0.25);
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.5), 0 4px 8px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 180, 60, 0.12);
            color: rgba(255, 160, 40, 0.75);
            touch-action: manipulation;
        }

        .list-btn:hover,
        .list-btn:focus-visible {
            color: rgba(255, 200, 80, 1);
            outline: none;
        }

        .list-btn:active {
            transform: translateY(2px);
        }

        .list-btn.active {
            color: #ffb030;
            border-color: rgba(255, 180, 40, 0.5);
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.5), 0 0 10px rgba(220, 140, 20, 0.2),
                inset 0 1px 0 rgba(255, 200, 60, 0.18);
        }

        /* Track index on LCD */
        .lcd-track-idx {
            position: absolute;
            top: 5px;
            right: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            color: rgba(255, 160, 40, 0.4);
            letter-spacing: 0.06em;
        }

        /* Progress bar below LCD shell */
        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 2px;
            user-select: none;
        }

        .progress-bar-bg {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 160, 40, 0.12);
            cursor: pointer;
            position: relative;
            touch-action: none;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #c87020, #ffb030);
            width: 0%;
            transition: width 0.2s linear;
            pointer-events: none;
        }

        .progress-time {
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            color: rgba(200, 140, 50, 0.5);
            flex-shrink: 0;
            width: 36px;
            text-align: right;
        }
    </style>
</head>

<body>

    <!-- ══ Background Video Loop ══ -->
    <video class="bg-video" autoplay muted loop playsinline poster="./bg.png" aria-hidden="true">
        <source src="./make_a_loop_video_of_this_imag.mp4" type="video/mp4">
    </video>

    <!-- Hidden Audio Player Engine -->
    <div id="yt-player-wrap" aria-hidden="true">
        <div id="yt-player"></div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- ── Retro Playlist Tray ── -->
    <div class="playlist-tray" id="playlistTray" role="region" aria-label="Song Playlist">
        <div class="tray-handle" id="trayHandle" role="button" tabindex="0" aria-label="Toggle Playlist Tray" aria-expanded="false">
            <span>♫ &nbsp;PLAYLIST &nbsp;·&nbsp; 44 TRACKS</span>
            <span class="tray-arrow" aria-hidden="true">▲</span>
        </div>
        <div class="tray-body" id="trackList" role="list"></div>
    </div>

    <div class="scene">

        <!-- ══ RADIO BODY ══════════════════════════════════════════════════ -->
        <main class="radio-body" role="region" aria-label="DARSH FM Radio Player">

            <!-- Antenna -->
            <div class="antenna-base" aria-hidden="true">
                <div class="antenna-pole"></div>
            </div>

            <!-- ── SPEAKER (left) ── -->
            <div class="speaker-panel" aria-hidden="true">
                <div class="speaker-grille"></div>
                <div class="speaker-logo">
                    <span class="logo-text">DARSH</span>
                    <span class="logo-sub">FM · RADIO</span>
                </div>
            </div>

            <!-- ── CENTER PANEL ── -->
            <div class="center-panel">

                <!-- LCD frequency display -->
                <div class="lcd-shell">
                    <div class="lcd-screen" role="status" aria-live="polite">
                        <div class="lcd-row">
                            <span class="lcd-band">FM</span>
                            <span class="lcd-freq" id="lcdFreq">98.7</span>
                            <span class="lcd-mhz">MHz</span>
                        </div>
                        <div class="lcd-meta" id="lcdMeta">DARSH RADIO · READY TO PLAY</div>
                        <span class="lcd-track-idx" id="lcdIdx">01/44</span>
                    </div>
                    <!-- Playlist toggle button right after the screen -->
                    <button class="lcd-list-btn" id="lcdListBtn" title="Toggle Playlist" aria-label="Toggle Playlist Drawer">
                        <span class="lcd-btn-icon" aria-hidden="true">♫</span>
                        <span class="lcd-btn-text">LIST</span>
                    </button>
                    <div class="signal-leds" id="signalLeds" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                    </div>
                </div>

                <!-- Progress bar -->
                <div class="progress-wrap">
                    <div class="progress-bar-bg" id="progressBg" role="slider" aria-label="Playback Position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
                        <div class="progress-bar-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-time" id="progressTime" aria-label="Current Playback Time">0:00</div>
                </div>

                <!-- Tuner band -->
                <div class="tuner-band" aria-hidden="true">
                    <div class="tuner-scale">
                        <span>88</span><span>92</span><span>96</span>
                        <span>100</span><span>104</span><span>108</span>
                    </div>
                    <div class="tuner-track">
                        <div class="tuner-fill"></div>
                        <div class="tuner-indicator" id="tunerIndicator">
                            <div class="tuner-needle-line"></div>
                        </div>
                    </div>
                </div>

                <!-- Preset buttons + LIST button -->
                <div class="presets-row" role="group" aria-label="Station Presets">
                    <div class="preset-group-label" aria-hidden="true">PRESETS</div>
                    <div class="presets-btns">
                        <button class="preset-btn" data-freq="91.1" data-meta="DARSH CHILL · SUNSET HAZE" aria-label="Preset 1: 91.1 MHz">
                            <span class="p-num">1</span><span class="p-freq">91.1</span>
                        </button>
                        <button class="preset-btn active" data-freq="98.7" data-meta="DARSH RADIO · MIDNIGHT DREAMS" aria-label="Preset 2: 98.7 MHz">
                            <span class="p-num">2</span><span class="p-freq">98.7</span>
                        </button>
                        <button class="preset-btn" data-freq="103.5" data-meta="DARSH HITS · ELECTRIC FEEL" aria-label="Preset 3: 103.5 MHz">
                            <span class="p-num">3</span><span class="p-freq">103.5</span>
                        </button>
                        <button class="preset-btn" data-freq="107.2" data-meta="DARSH DEEP · ABYSSAL" aria-label="Preset 4: 107.2 MHz">
                            <span class="p-num">4</span><span class="p-freq">107.2</span>
                        </button>
                        <button class="list-btn" id="listBtn" aria-label="Open Playlist">
                            <span class="p-num">♫</span><span class="p-freq">LIST</span>
                        </button>
                    </div>
                </div>

            </div>

            <!-- ── RIGHT PANEL: Knobs + play ── -->
            <div class="right-panel">

                <!-- Volume knob -->
                <div class="knob-group">
                    <div class="knob-label" id="volLabel">VOL</div>
                    <div class="knob-ring" role="slider" aria-labelledby="volLabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75" tabindex="0">
                        <div class="knob" id="volKnob">
                            <div class="knob-marker"></div>
                            <div class="knob-shine"></div>
                        </div>
                    </div>
                    <div class="knob-ticks" aria-hidden="true">
                        <span class="tk-l">–</span>
                        <span class="tk-r">+</span>
                    </div>
                </div>

                <div class="panel-divider" aria-hidden="true"></div>

                <!-- Play/Stop button -->
                <div class="play-group">
                    <button class="play-button" id="playBtn" aria-label="Play Track" aria-pressed="false">
                        <div class="play-led" id="playLed" aria-hidden="true"></div>
                        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" style="display:none" aria-hidden="true">
                            <rect x="5" y="5" width="14" height="14" rx="2" />
                        </svg>
                    </button>
                    <div class="play-label" aria-hidden="true">ON / OFF</div>
                </div>

                <div class="panel-divider" aria-hidden="true"></div>

                <!-- Tune knob — drag ↑ next · drag ↓ prev -->
                <div class="knob-group">
                    <div class="knob-label" id="tuneLabel">TUNE</div>
                    <div class="knob-ring" role="slider" aria-labelledby="tuneLabel" aria-valuemin="1" aria-valuemax="44" aria-valuenow="1" tabindex="0">
                        <div class="knob" id="tuneKnob">
                            <div class="knob-marker"></div>
                            <div class="knob-shine"></div>
                        </div>
                    </div>
                    <div class="knob-ticks" aria-hidden="true">
                        <span class="tk-l">◂</span>
                        <span class="tk-r">▸</span>
                    </div>
                </div>

            </div>

        </main><!-- /radio-body -->
    </div><!-- /scene -->

            { id: 32, title: "Tenu Sang Rakhna",        artist: "Arijit Singh",               yt: "0k57_u0b3aQ" },
            { id: 33, title: "Bulleya",                 artist: "Papon",                      yt: "MzFGDIJuRnQ" },
            { id: 34, title: "Kun Faya Kun",            artist: "A.R. Rahman",                yt: "T94PHkCQBCQ" },
            { id: 35, title: "Dil To Bachcha Hai",      artist: "Rahat Fateh Ali Khan",       yt: "yqFDWtFbxPg" },
            { id: 36, title: "Raabta",                  artist: "Arijit Singh",               yt: "sS6-P1d5H-g" },
            { id: 37, title: "O Rangrez",               artist: "Shreya Ghoshal",             yt: "W5GBH6YsGWg" },
            { id: 38, title: "Kaise Hua",               artist: "Vishal Mishra",              yt: "Fp8msa5uYsc" },
            { id: 39, title: "Tu Chahiye",              artist: "Atif Aslam",                 yt: "zuvla6ABKbs" },
            { id: 40, title: "Finding Her (Female)",    artist: "Kushagra, Saaheal",          yt: "P8cT2Hy96SU" },
            { id: 41, title: "Zindagi Kuch Toh Bata",   artist: "Jubin Nautiyal",             yt: "3hq9SxcJjuQ" },
            { id: 42, title: "Mann Mera",               artist: "Gajendra Verma",             yt: "F0f5nB4h0r4" },
            { id: 43, title: "Tera Ghata",              artist: "Gajendra Verma",             yt: "K3-a8l2gH6k" },
            { id: 44, title: "O Saathi",                artist: "Atif Aslam",                 yt: "7R6FoUE7yM8" },
        ];

        // ════════════════════════════════════════════════════════════════════════════
        // UNIFIED STATE (Single Source of Truth)
        // ════════════════════════════════════════════════════════════════════════════
        const state = {
            currentIndex: 0,
            isPlaying: false,
            volume: 75, // 0 - 100
            currentTime: 0,
            duration: 0,
            isBuffering: false,
            isSeeking: false,
            trayOpen: false,
        };

        let ytPlayer = null;
        let ytReady = false;
        let pendingPlay = false;
        let progressRaf = null;
        let vizRaf = null;
        let loadTrackTimeout = null;
        let isSwitchingTrack = false;

        // Knob Angles & Drag variables
        let volAngle = -100 + (state.volume / 100) * 200;
        let tuneAngle = 0;
        let draggingVol = false, volStartY = 0, volStartAngle = volAngle;
        let draggingTune = false, tuneStartY = 0, tuneStartAngle = 0;
        let tuneAccumPx = 0;
        const PX_PER_TRACK = 28;

        // Station presets (frequency display)
        const stations = {
            '91.1':  { needle: 0.07  },
            '98.7':  { needle: 0.508 },
            '103.5': { needle: 0.756 },
            '107.2': { needle: 0.942 },
        };

        // ════════════════════════════════════════════════════════════════════════════
        // DOM REFERENCES
        // ════════════════════════════════════════════════════════════════════════════
        const playBtn        = document.getElementById('playBtn');
        const playLed        = document.getElementById('playLed');
        const playIcon       = playBtn.querySelector('.icon-play');
        const stopIcon       = playBtn.querySelector('.icon-stop');
        const lcdFreq        = document.getElementById('lcdFreq');
        const lcdMeta        = document.getElementById('lcdMeta');
        const lcdIdx         = document.getElementById('lcdIdx');
        const tunerIndicator = document.getElementById('tunerIndicator');
        const signalLeds     = document.getElementById('signalLeds');
        const volKnob        = document.getElementById('volKnob');
        const tuneKnob       = document.getElementById('tuneKnob');
        const progressFill   = document.getElementById('progressFill');
        const progressBg     = document.getElementById('progressBg');
        const progressTime   = document.getElementById('progressTime');
        const playlistTray   = document.getElementById('playlistTray');
        const trayHandle     = document.getElementById('trayHandle');
        const listBtn        = document.getElementById('listBtn');
        const lcdListBtn     = document.getElementById('lcdListBtn');
        const trackList      = document.getElementById('trackList');

        // ════════════════════════════════════════════════════════════════════════════
        // YOUTUBE IFRAME API INITIALIZATION
        // ════════════════════════════════════════════════════════════════════════════
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '120', width: '200',
                videoId: PLAYLIST[state.currentIndex].yt,
                playerVars: {
                    autoplay: 0,
                    controls: 0,
                    rel: 0,
                    modestbranding: 1,
                    iv_load_policy: 3,
                    disablekb: 1,
                    playsinline: 1,
                    enablejsapi: 1,
                },
                events: {
                    onReady: onPlayerReady,
                    onStateChange: onPlayerStateChange,
                    onError: onPlayerError,
                }
            });
        }

        function onPlayerReady(event) {
            ytReady = true;
            event.target.setVolume(state.volume);
            if (pendingPlay) {
                event.target.playVideo();
                pendingPlay = false;
            }
        }

        function onPlayerError(event) {
            console.warn('Playback error code:', event.data);
            lcdMeta.textContent = "TRACK UNAVAILABLE · SKIPPING...";
            flashLCD();
            setTimeout(() => {
                nextTrack(true);
            }, 1200);
        }

        function onPlayerStateChange(event) {
            const S = YT.PlayerState;
            if (event.data === S.PLAYING) {
                state.isPlaying = true;
                state.isBuffering = false;
                updateUIState(true);
                startProgress();
            } else if (event.data === S.ENDED) {
                // Naturally finished -> Advance to next track
                nextTrack(true);
            } else if (event.data === S.BUFFERING) {
                state.isBuffering = true;
                if (state.isPlaying) startViz();
            } else if (event.data === S.PAUSED) {
                if (state.isPlaying && !isSwitchingTrack) {
                    state.isPlaying = false;
                    updateUIState(false);
                    stopProgress();
                }
            }
        }

        // ════════════════════════════════════════════════════════════════════════════
        // PLAYER CONTROLLER
        // ════════════════════════════════════════════════════════════════════════════
        function loadAndPlay(idx, autoStart = true) {
            state.currentIndex = ((idx % PLAYLIST.length) + PLAYLIST.length) % PLAYLIST.length;
            refreshLCD();
            flashLCD();
            highlightTrack(state.currentIndex);

            if (autoStart) {
                state.isPlaying = true;
                updateUIState(true);
            }

            if (!ytPlayer || !ytReady) {
                if (autoStart) pendingPlay = true;
                return;
            }

            isSwitchingTrack = true;
            if (loadTrackTimeout) clearTimeout(loadTrackTimeout);
            loadTrackTimeout = setTimeout(() => {
                try {
                    if (autoStart) {
                        ytPlayer.loadVideoById({
                            videoId: PLAYLIST[state.currentIndex].yt,
                            startSeconds: 0
                        });
                        ytPlayer.playVideo();
                    } else {
                        ytPlayer.cueVideoById({
                            videoId: PLAYLIST[state.currentIndex].yt,
                            startSeconds: 0
                        });
                    }
                } catch (e) {
                    console.error('Error loading video:', e);
                } finally {
                    setTimeout(() => { isSwitchingTrack = false; }, 350);
                }
            }, 30);
        }

        function play() {
            state.isPlaying = true;
            updateUIState(true);
            if (!ytPlayer || !ytReady) {
                pendingPlay = true;
                return;
            }
            if (ytPlayer.getPlayerState() === YT.PlayerState.PAUSED) {
                ytPlayer.playVideo();
            } else {
                loadAndPlay(state.currentIndex, true);
            }
        }

        function pause() {
            state.isPlaying = false;
            updateUIState(false);
            if (ytPlayer && ytReady) {
                ytPlayer.pauseVideo();
            }
        }

        function togglePlay() {
            playBtn.classList.add('pressed');
            setTimeout(() => playBtn.classList.remove('pressed'), 140);
            state.isPlaying ? pause() : play();
        }

        function nextTrack(autoPlay = true) {
            state.currentIndex = (state.currentIndex + 1) % PLAYLIST.length;
            loadAndPlay(state.currentIndex, autoPlay || state.isPlaying);
        }

        function prevTrack(autoPlay = true) {
            // If current playback time > 3 seconds: restart current song from 0
            if (ytPlayer && ytReady) {
                try {
                    const curTime = ytPlayer.getCurrentTime() || 0;
                    if (curTime > 3) {
                        ytPlayer.seekTo(0, true);
                        progressFill.style.width = '0%';
                        progressTime.textContent = '0:00';
                        return;
                    }
                } catch(e) {}
            }
            // Otherwise move to previous track
            state.currentIndex = (state.currentIndex - 1 + PLAYLIST.length) % PLAYLIST.length;
            loadAndPlay(state.currentIndex, autoPlay || state.isPlaying);
        }

        // ════════════════════════════════════════════════════════════════════════════
        // UI SYNCHRONIZATION HELPERS
        // ════════════════════════════════════════════════════════════════════════════
        function setKnob(el, deg) {
            el.style.transform = `rotate(${deg}deg)`;
        }

        function refreshLCD() {
            const t = PLAYLIST[state.currentIndex];
            lcdMeta.textContent = t.artist ? `${t.title} · ${t.artist}` : t.title;
            lcdIdx.textContent = `${String(state.currentIndex + 1).padStart(2, '0')}/44`;
        }

        function updateUIState(on) {
            playIcon.style.display = on ? 'none' : '';
            stopIcon.style.display = on ? '' : 'none';
            playBtn.setAttribute('aria-label', on ? 'Pause Track' : 'Play Track');
            playBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
            if (on) {
                playLed.classList.add('on');
                signalLeds.classList.add('active');
                startViz();
            } else {
                playLed.classList.remove('on');
                signalLeds.classList.remove('active');
                stopViz();
            }
        }

        function flashLCD() {
            lcdFreq.classList.add('flicker');
            setTimeout(() => lcdFreq.classList.remove('flicker'), 180);
        }

        function fmtTime(s) {
            if (isNaN(s) || !isFinite(s) || s < 0) return '0:00';
            const m = Math.floor(s / 60);
            const ss = String(Math.floor(s % 60)).padStart(2, '0');
            return `${m}:${ss}`;
        }

        // Progress bar ticker
        function startProgress() {
            if (progressRaf) return;
            (function tick() {
                if (ytPlayer && ytReady && !state.isSeeking) {
                    try {
                        const cur = ytPlayer.getCurrentTime() || 0;
                        const dur = ytPlayer.getDuration() || 0;
                        state.currentTime = cur;
                        state.duration = dur;
                        if (dur > 0) {
                            const pct = Math.min(100, Math.max(0, (cur / dur) * 100));
                            progressFill.style.width = `${pct}%`;
                            progressBg.setAttribute('aria-valuenow', Math.round(pct));
                        }
                        progressTime.textContent = fmtTime(cur);
                    } catch (e) { }
                }
                progressRaf = requestAnimationFrame(tick);
            })();
        }

        function stopProgress() {
            if (progressRaf) {
                cancelAnimationFrame(progressRaf);
                progressRaf = null;
            }
        }

        // Click & Drag to Seek
        function handleSeek(clientX) {
            if (!ytPlayer || !ytReady) return;
            const rect = progressBg.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            const dur = ytPlayer.getDuration() || 0;
            progressFill.style.width = `${pct * 100}%`;
            progressTime.textContent = fmtTime(pct * dur);
            ytPlayer.seekTo(pct * dur, true);
        }

        progressBg.addEventListener('click', e => handleSeek(e.clientX));

        // ════════════════════════════════════════════════════════════════════════════
        // PLAYLIST DRAWER BUILDER
        // ════════════════════════════════════════════════════════════════════════════
        function buildTrackList() {
            trackList.innerHTML = '';
            PLAYLIST.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = 'track-item' + (i === state.currentIndex ? ' active' : '');
                item.dataset.idx = i;
                item.setAttribute('role', 'listitem');
                item.setAttribute('tabindex', '0');
                item.setAttribute('aria-label', `${t.title} by ${t.artist || 'Unknown'}`);
                item.innerHTML = `
                    <span class="track-num">${String(i + 1).padStart(2, '0')}</span>
                    <div class="cd-disc" aria-hidden="true"></div>
                    <div class="track-info">
                        <div class="track-title">${t.title}</div>
                        ${t.artist ? `<div class="track-artist">${t.artist}</div>` : ''}
                    </div>
                    <span class="track-play-icon" aria-hidden="true">${i === state.currentIndex ? '▶' : ''}</span>`;
                
                const selectTrack = () => loadAndPlay(i, true);
                item.addEventListener('click', selectTrack);
                item.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        selectTrack();
                    }
                });
                trackList.appendChild(item);
            });
        }

        function highlightTrack(idx) {
            document.querySelectorAll('.track-item').forEach((el, i) => {
                const isActive = (i === idx);
                el.classList.toggle('active', isActive);
                const playIconSpan = el.querySelector('.track-play-icon');
                if (playIconSpan) playIconSpan.textContent = isActive ? '▶' : '';
            });
            const active = trackList.querySelector('.track-item.active');
            if (active && state.trayOpen) {
                active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        // Toggle Playlist Drawer
        function toggleTray() {
            state.trayOpen = !state.trayOpen;
            playlistTray.classList.toggle('open', state.trayOpen);
            trayHandle.setAttribute('aria-expanded', state.trayOpen ? 'true' : 'false');
            if (listBtn) listBtn.classList.toggle('active', state.trayOpen);
            if (lcdListBtn) {
                lcdListBtn.classList.toggle('active', state.trayOpen);
                lcdListBtn.classList.add('pressed');
                setTimeout(() => lcdListBtn.classList.remove('pressed'), 120);
            }
            if (state.trayOpen) {
                setTimeout(() => {
                    const active = trackList.querySelector('.track-item.active');
                    if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }, 80);
            }
        }

        trayHandle.addEventListener('click', toggleTray);
        trayHandle.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleTray();
            }
        });
        if (listBtn) listBtn.addEventListener('click', toggleTray);
        if (lcdListBtn) lcdListBtn.addEventListener('click', toggleTray);

        playBtn.addEventListener('click', togglePlay);

        // ════════════════════════════════════════════════════════════════════════════
        // VOLUME & TUNE KNOBS (Mouse + Touch Support)
        // ════════════════════════════════════════════════════════════════════════════
        setKnob(volKnob, volAngle);
        setKnob(tuneKnob, tuneAngle);

        // Volume knob interaction
        function startVolDrag(clientY) {
            draggingVol = true;
            volStartY = clientY;
            volStartAngle = volAngle;
            document.body.style.cursor = 'ns-resize';
        }
        function moveVolDrag(clientY) {
            if (!draggingVol) return;
            const delta = (volStartY - clientY) * 1.5;
            volAngle = Math.max(-100, Math.min(100, volStartAngle + delta));
            state.volume = Math.round((volAngle + 100) / 2); // 0 - 100
            setKnob(volKnob, volAngle);
            if (ytPlayer && ytReady) ytPlayer.setVolume(state.volume);
        }
        function endVolDrag() {
            if (draggingVol) {
                draggingVol = false;
                document.body.style.cursor = '';
            }
        }

        volKnob.parentElement.addEventListener('mousedown', e => startVolDrag(e.clientY));
        window.addEventListener('mousemove', e => moveVolDrag(e.clientY));
        window.addEventListener('mouseup', endVolDrag);

        volKnob.parentElement.addEventListener('touchstart', e => {
            if (e.touches.length > 0) startVolDrag(e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchmove', e => {
            if (draggingVol && e.touches.length > 0) moveVolDrag(e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchend', endVolDrag);

        // Tuning knob interaction
        function startTuneDrag(clientY) {
            draggingTune = true;
            tuneStartY = clientY;
            tuneStartAngle = tuneAngle;
            tuneAccumPx = 0;
            document.body.style.cursor = 'ns-resize';
        }
        function moveTuneDrag(clientY) {
            if (!draggingTune) return;
            const rawDeltaPx = tuneStartY - clientY;
            tuneAngle = tuneStartAngle + rawDeltaPx * 1.5;
            setKnob(tuneKnob, tuneAngle);

            // Move indicator needle decoratively
            const raw = ((tuneAngle % 360) + 360) % 360;
            tunerIndicator.style.left = `${(raw / 360) * 100}%`;
            lcdFreq.textContent = (87.5 + (raw / 360) * (108 - 87.5)).toFixed(1);

            // Step track based on pixel threshold
            const steps = Math.floor(rawDeltaPx / PX_PER_TRACK);
            const needed = steps - Math.round(tuneAccumPx / PX_PER_TRACK);
            if (needed > 0) {
                nextTrack(state.isPlaying);
                tuneAccumPx += PX_PER_TRACK;
            } else if (needed < 0) {
                prevTrack(state.isPlaying);
                tuneAccumPx -= PX_PER_TRACK;
            }
        }
        function endTuneDrag() {
            if (draggingTune) {
                draggingTune = false;
                document.body.style.cursor = '';
            }
        }

        tuneKnob.parentElement.addEventListener('mousedown', e => startTuneDrag(e.clientY));
        window.addEventListener('mousemove', e => moveTuneDrag(e.clientY));
        window.addEventListener('mouseup', endTuneDrag);

        tuneKnob.parentElement.addEventListener('touchstart', e => {
            if (e.touches.length > 0) startTuneDrag(e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchmove', e => {
            if (draggingTune && e.touches.length > 0) moveTuneDrag(e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchend', endTuneDrag);

        // ════════════════════════════════════════════════════════════════════════════
        // STATION PRESETS
        // ════════════════════════════════════════════════════════════════════════════
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.add('pressed');
                setTimeout(() => btn.classList.remove('pressed'), 120);
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const freq = btn.dataset.freq;
                const s = stations[freq];
                animateFreq(parseFloat(lcdFreq.textContent), parseFloat(freq));
                tunerIndicator.style.left = `${s.needle * 100}%`;
                tuneAngle = s.needle * 360;
                setKnob(tuneKnob, tuneAngle);
                flashLCD();
            });
        });
        tunerIndicator.style.left = `${stations['98.7'].needle * 100}%`;

        function animateFreq(from, to) {
            const dur = 350, start = performance.now();
            (function step(now) {
                const t = Math.min((now - start) / dur, 1);
                const e = 1 - Math.pow(1 - t, 3);
                lcdFreq.textContent = (from + (to - from) * e).toFixed(1);
                if (t < 1) requestAnimationFrame(step);
            })(performance.now());
        }

        // ════════════════════════════════════════════════════════════════════════════
        // AUDIO LED VISUALIZER
        // ════════════════════════════════════════════════════════════════════════════
        function startViz() {
            if (vizRaf) return;
            (function frame() {
                const leds = document.querySelectorAll('.signal-leds span');
                const count = leds.length;
                const t = performance.now() / 1000;
                const amp = Math.sin(t * 3.1) * 0.35 + Math.sin(t * 7.3) * 0.2 + 0.6;
                const active = Math.round(amp * count);
                leds.forEach((s, i) => {
                    s.classList.toggle('lit', i < active);
                    s.classList.toggle('peak', i === count - 1 && active === count);
                });
                vizRaf = requestAnimationFrame(frame);
            })();
        }

        function stopViz() {
            if (vizRaf) {
                cancelAnimationFrame(vizRaf);
                vizRaf = null;
            }
            document.querySelectorAll('.signal-leds span').forEach(s => s.classList.remove('lit', 'peak'));
        }

        // ════════════════════════════════════════════════════════════════════════════
        // INITIALIZATION
        // ════════════════════════════════════════════════════════════════════════════
        refreshLCD();
        buildTrackList();

        // Slow ambient background video loop
        const bgVideo = document.querySelector('.bg-video');
        if (bgVideo) {
            bgVideo.playbackRate = 0.35;
            bgVideo.addEventListener('loadedmetadata', () => { bgVideo.playbackRate = 0.35; });
            bgVideo.addEventListener('play', () => { bgVideo.playbackRate = 0.35; });
        }

        // Entrance animation
        const radioBodyEl = document.querySelector('.radio-body');
        if (radioBodyEl) {
            radioBodyEl.animate([
                { opacity: 0, transform: 'translateY(40px) scale(0.97)' },
                { opacity: 1, transform: 'translateY(0) scale(1)' }
            ], { duration: 650, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' });
        }
    </script>
