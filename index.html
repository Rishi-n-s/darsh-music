<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARSH FM — Retro FM Music Player</title>
    <meta name="description" content="DARSH FM — A retro skeuomorphic FM radio player featuring curated indie tracks.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* ── Hidden audio player engine ── */
        #yt-player-wrap {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 200px;
            height: 120px;
            opacity: 0.001; /* Active on-screen layer so browser media engine never throttles */
            pointer-events: none;
            z-index: -10;
        }

        /* ── Playlist tray ── slides in and out of the radio top slot ── */
        .playlist-tray {
            position: fixed;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%) translateY(calc(100% - 32px));
            width: min(480px, 94vw);
            max-width: calc(100vw - 20px);
            z-index: 10;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .playlist-tray.open {
            transform: translateX(-50%) translateY(0);
        }

        /* Radio sits in front so tray slides directly inside it */
        .scene {
            position: relative;
            z-index: 20;
        }

        /* Tray handle — stays docked on the radio top slot when closed */
        .tray-handle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            min-height: 34px;
            background: linear-gradient(180deg, #3d2a10 0%, #2a1d09 100%);
            border: 1px solid rgba(255, 160, 40, 0.25);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.2em;
            color: rgba(200, 140, 50, 0.85);
            user-select: none;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.3);
            transition: color 0.2s, background 0.2s;
            touch-action: manipulation;
        }

        .tray-handle:hover,
        .tray-handle:focus-visible {
            color: rgba(255, 190, 60, 1);
            background: linear-gradient(180deg, #483214 0%, #32230b 100%);
            outline: none;
        }

        .tray-arrow {
            display: inline-block;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .playlist-tray.open .tray-arrow {
            transform: rotate(180deg);
        }

        /* Scrollable song list — sits below handle, slides down into radio body */
        .tray-body {
            max-height: 260px;
            overflow-y: auto;
            background: linear-gradient(180deg, #201408 0%, #180f05 100%);
            border: 1px solid rgba(255, 160, 40, 0.18);
            border-top: none;
            border-radius: 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            -webkit-overflow-scrolling: touch;
        }

        .tray-body::-webkit-scrollbar {
            width: 4px;
        }

        .tray-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .tray-body::-webkit-scrollbar-thumb {
            background: rgba(255, 160, 40, 0.25);
            border-radius: 2px;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            min-height: 44px; /* Comfortable touch target */
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 160, 40, 0.06);
            transition: background 0.15s;
            user-select: none;
            touch-action: manipulation;
        }

        .track-item:hover,
        .track-item:focus-visible {
            background: rgba(255, 160, 40, 0.08);
            outline: none;
        }

        .track-item.active {
            background: rgba(255, 160, 40, 0.12);
            border-left: 3px solid rgba(255, 160, 40, 0.65);
        }

        .track-num {
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            color: rgba(200, 130, 40, 0.45);
            width: 22px;
            flex-shrink: 0;
        }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: rgba(255, 180, 60, 0.85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            color: rgba(180, 120, 40, 0.55);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .track-play-icon {
            font-size: 10px;
            color: rgba(255, 160, 40, 0.5);
            flex-shrink: 0;
            width: 14px;
            text-align: center;
        }

        .track-item.active .track-play-icon {
            color: #ffb030;
        }

        /* ── Mini spinning CD disc ── */
        .cd-disc {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            position: relative;
            background:
                radial-gradient(circle at 50% 50%,
                    #1a1108 0%,
                    #1a1108 18%,
                    transparent 18%),
                conic-gradient(from 0deg,
                    rgba(255, 160, 40, 0.35),
                    rgba(200, 100, 20, 0.2),
                    rgba(255, 200, 80, 0.4),
                    rgba(180, 80, 10, 0.2),
                    rgba(255, 160, 40, 0.35)),
                radial-gradient(circle, #3a2810 0%, #1a0e04 100%);
            box-shadow:
                0 0 0 1px rgba(255, 160, 40, 0.15),
                inset 0 0 4px rgba(0, 0, 0, 0.6);
            transition: opacity 0.2s;
        }

        .cd-disc::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #0e0804;
            border: 1px solid rgba(255, 160, 40, 0.2);
            box-shadow: 0 0 3px rgba(255, 140, 20, 0.3);
        }

        .cd-disc::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 4px;
            width: 7px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 220, 120, 0.22);
            transform: rotate(-30deg);
            pointer-events: none;
        }

        .track-item.active .cd-disc {
            animation: cdSpin 3s linear infinite;
            box-shadow:
                0 0 0 1px rgba(255, 160, 40, 0.4),
                0 0 8px rgba(255, 140, 20, 0.25),
                inset 0 0 4px rgba(0, 0, 0, 0.5);
        }

        @keyframes cdSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* LCD List button placed right after the LCD display */
        .lcd-list-btn {
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            border-radius: 6px;
            margin: 0 4px 0 8px;
            padding: 6px 10px;
            min-height: 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            user-select: none;
            flex-shrink: 0;
            background: linear-gradient(180deg, #3d2a10 0%, #2a1c08 60%, #1c1305 100%);
            border: 1px solid rgba(255, 160, 40, 0.3);
            box-shadow:
                0 2px 0 rgba(0, 0, 0, 0.6),
                0 3px 6px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 180, 60, 0.2);
            color: rgba(255, 180, 60, 0.85);
            transition: transform 0.08s ease, box-shadow 0.08s ease, color 0.2s, background 0.2s, border-color 0.2s;
            touch-action: manipulation;
        }

        .lcd-list-btn:hover,
        .lcd-list-btn:focus-visible {
            color: #ffb830;
            border-color: rgba(255, 180, 40, 0.6);
            box-shadow:
                0 2px 0 rgba(0, 0, 0, 0.6),
                0 0 10px rgba(255, 160, 40, 0.3),
                inset 0 1px 0 rgba(255, 200, 80, 0.3);
            outline: none;
        }

        .lcd-list-btn.pressed,
        .lcd-list-btn:active {
            transform: translateY(2px);
            box-shadow:
                0 0 0 rgba(0, 0, 0, 0.6),
                0 1px 3px rgba(0, 0, 0, 0.4),
                inset 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .lcd-list-btn.active {
            background: linear-gradient(180deg, #5a3a08 0%, #3e2606 60%, #2b1a04 100%);
            color: #ffc040;
            border-color: rgba(255, 190, 60, 0.7);
            box-shadow:
                0 2px 0 rgba(0, 0, 0, 0.6),
                0 0 12px rgba(255, 160, 40, 0.4),
                inset 0 1px 0 rgba(255, 220, 100, 0.4);
        }

        .lcd-btn-icon {
            font-size: 11px;
            line-height: 1;
        }

        .lcd-btn-text {
            font-size: 8px;
            letter-spacing: 0.12em;
            font-weight: bold;
            line-height: 1;
        }

        /* List button in presets row */
        .list-btn {
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            border-radius: 4px;
            padding: 5px 10px;
            min-height: 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            user-select: none;
            transition: transform 0.08s ease, box-shadow 0.08s ease, color 0.2s;
            background: linear-gradient(180deg, #3a2810 0%, #2a1c08 55%, #1e1506 100%);
            border: 1px solid rgba(255, 160, 40, 0.25);
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.5), 0 4px 8px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 180, 60, 0.12);
            color: rgba(255, 160, 40, 0.75);
            touch-action: manipulation;
        }

        .list-btn:hover,
        .list-btn:focus-visible {
            color: rgba(255, 200, 80, 1);
            outline: none;
        }

        .list-btn:active {
            transform: translateY(2px);
        }

        .list-btn.active {
            color: #ffb030;
            border-color: rgba(255, 180, 40, 0.5);
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.5), 0 0 10px rgba(220, 140, 20, 0.2),
                inset 0 1px 0 rgba(255, 200, 60, 0.18);
        }

        /* Track index on LCD */
        .lcd-track-idx {
            position: absolute;
            top: 5px;
            right: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            color: rgba(255, 160, 40, 0.4);
            letter-spacing: 0.06em;
        }

        /* Progress bar below LCD shell */
        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 2px;
            user-select: none;
        }

        .progress-bar-bg {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 160, 40, 0.12);
            cursor: pointer;
            position: relative;
            touch-action: none;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #c87020, #ffb030);
            width: 0%;
            transition: width 0.2s linear;
            pointer-events: none;
        }

        .progress-time {
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            color: rgba(200, 140, 50, 0.5);
            flex-shrink: 0;
            width: 36px;
            text-align: right;
        }
    </style>
</head>

<body>

    <!-- ══ Background Video Loop ══ -->
    <video class="bg-video" autoplay muted loop playsinline poster="./bg.png" aria-hidden="true">
        <source src="./make_a_loop_video_of_this_imag.mp4" type="video/mp4">
    </video>

    <!-- Hidden Audio Player Engine (Reused single player instance) -->
    <div id="yt-player-wrap" aria-hidden="true">
        <div id="yt-player"></div>
    </div>

    <!-- Official YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- ── Retro Playlist Tray ── -->
    <div class="playlist-tray" id="playlistTray" role="region" aria-label="Song Playlist">
        <div class="tray-handle" id="trayHandle" role="button" tabindex="0" aria-label="Toggle Playlist Tray" aria-expanded="false">
            <span>♫ &nbsp;PLAYLIST &nbsp;·&nbsp; 44 TRACKS</span>
            <span class="tray-arrow" aria-hidden="true">▲</span>
        </div>
        <div class="tray-body" id="trackList" role="list"></div>
    </div>

    <div class="scene">

        <!-- ══ RADIO BODY ══════════════════════════════════════════════════ -->
        <main class="radio-body" role="region" aria-label="DARSH FM Radio Player">

            <!-- Antenna -->
            <div class="antenna-base" aria-hidden="true">
                <div class="antenna-pole"></div>
            </div>

            <!-- ── SPEAKER (left) ── -->
            <div class="speaker-panel" aria-hidden="true">
                <div class="speaker-grille"></div>
                <div class="speaker-logo">
                    <span class="logo-text">DARSH</span>
                    <span class="logo-sub">FM · RADIO</span>
                </div>
            </div>

            <!-- ── CENTER PANEL ── -->
            <div class="center-panel">

                <!-- LCD frequency display -->
                <div class="lcd-shell">
                    <div class="lcd-screen" role="status" aria-live="polite">
                        <div class="lcd-row">
                            <span class="lcd-band">FM</span>
                            <span class="lcd-freq" id="lcdFreq">98.7</span>
                            <span class="lcd-mhz">MHz</span>
                        </div>
                        <div class="lcd-meta" id="lcdMeta">DARSH RADIO · READY TO PLAY</div>
                        <span class="lcd-track-idx" id="lcdIdx">01/44</span>
                    </div>
                    <!-- Playlist toggle button right after the screen -->
                    <button class="lcd-list-btn" id="lcdListBtn" title="Toggle Playlist" aria-label="Toggle Playlist Drawer">
                        <span class="lcd-btn-icon" aria-hidden="true">♫</span>
                        <span class="lcd-btn-text">LIST</span>
                    </button>
                    <div class="signal-leds" id="signalLeds" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                    </div>
                </div>

                <!-- Progress bar -->
                <div class="progress-wrap">
                    <div class="progress-bar-bg" id="progressBg" role="slider" aria-label="Playback Position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
                        <div class="progress-bar-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-time" id="progressTime" aria-label="Current Playback Time">0:00</div>
                </div>

                <!-- Tuner band -->
                <div class="tuner-band" aria-hidden="true">
                    <div class="tuner-scale">
                        <span>88</span><span>92</span><span>96</span>
                        <span>100</span><span>104</span><span>108</span>
                    </div>
                    <div class="tuner-track">
                        <div class="tuner-fill"></div>
                        <div class="tuner-indicator" id="tunerIndicator">
                            <div class="tuner-needle-line"></div>
                        </div>
                    </div>
                </div>

                <!-- Preset buttons + LIST button -->
                <div class="presets-row" role="group" aria-label="Station Presets">
                    <div class="preset-group-label" aria-hidden="true">PRESETS</div>
                    <div class="presets-btns">
                        <button class="preset-btn" data-freq="91.1" data-meta="DARSH CHILL · SUNSET HAZE" aria-label="Preset 1: 91.1 MHz">
                            <span class="p-num">1</span><span class="p-freq">91.1</span>
                        </button>
                        <button class="preset-btn active" data-freq="98.7" data-meta="DARSH RADIO · MIDNIGHT DREAMS" aria-label="Preset 2: 98.7 MHz">
                            <span class="p-num">2</span><span class="p-freq">98.7</span>
                        </button>
                        <button class="preset-btn" data-freq="103.5" data-meta="DARSH HITS · ELECTRIC FEEL" aria-label="Preset 3: 103.5 MHz">
                            <span class="p-num">3</span><span class="p-freq">103.5</span>
                        </button>
                        <button class="preset-btn" data-freq="107.2" data-meta="DARSH DEEP · ABYSSAL" aria-label="Preset 4: 107.2 MHz">
                            <span class="p-num">4</span><span class="p-freq">107.2</span>
                        </button>
                        <button class="list-btn" id="listBtn" aria-label="Open Playlist">
                            <span class="p-num">♫</span><span class="p-freq">LIST</span>
                        </button>
                    </div>
                </div>

            </div>

            <!-- ── RIGHT PANEL: Knobs + play ── -->
            <div class="right-panel">

                <!-- Volume knob -->
                <div class="knob-group">
                    <div class="knob-label" id="volLabel">VOL</div>
                    <div class="knob-ring" role="slider" aria-labelledby="volLabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75" tabindex="0">
                        <div class="knob" id="volKnob">
                            <div class="knob-marker"></div>
                            <div class="knob-shine"></div>
                        </div>
                    </div>
                    <div class="knob-ticks" aria-hidden="true">
                        <span class="tk-l">–</span>
                        <span class="tk-r">+</span>
                    </div>
                </div>

                <div class="panel-divider" aria-hidden="true"></div>

                <!-- Play/Stop button -->
                <div class="play-group">
                    <button class="play-button" id="playBtn" aria-label="Play Track" aria-pressed="false">
                        <div class="play-led" id="playLed" aria-hidden="true"></div>
                        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" style="display:none" aria-hidden="true">
                            <rect x="5" y="5" width="14" height="14" rx="2" />
                        </svg>
                    </button>
                    <div class="play-label" aria-hidden="true">ON / OFF</div>
                </div>

                <div class="panel-divider" aria-hidden="true"></div>

                <!-- Tune knob — drag ↑ next · drag ↓ prev -->
                <div class="knob-group">
                    <div class="knob-label" id="tuneLabel">TUNE</div>
                    <div class="knob-ring" role="slider" aria-labelledby="tuneLabel" aria-valuemin="1" aria-valuemax="44" aria-valuenow="1" tabindex="0">
                        <div class="knob" id="tuneKnob">
                            <div class="knob-marker"></div>
                            <div class="knob-shine"></div>
                        </div>
                    </div>
                    <div class="knob-ticks" aria-hidden="true">
                        <span class="tk-l">◂</span>
                        <span class="tk-r">▸</span>
                    </div>
                </div>

            </div>

        </main><!-- /radio-body -->
    </div><!-- /scene -->

        // ════════════════════════════════════════════════════════════════════════════
        // 2. PROVIDER ADAPTER: YouTube Provider
        // ════════════════════════════════════════════════════════════════════════════
        class YouTubeProvider {
            constructor() {
                this.player = null;
                this.isReady = false;
                this.callbacks = {};
                this.currentVideoId = null;
                this.loadToken = 0;
            }

            init(callbacks) {
                this.callbacks = callbacks;
                if (window.YT && window.YT.Player) {
                    this._createPlayer();
                } else {
                    window.onYouTubeIframeAPIReady = () => this._createPlayer();
                }
            }

            _createPlayer() {
                this.player = new YT.Player('yt-player', {
                    height: '120', width: '200',
                    videoId: PLAYLIST[0].videoId,
                    playerVars: {
                        autoplay: 0,
                        controls: 0,
                        rel: 0,
                        modestbranding: 1,
                        iv_load_policy: 3,
                        disablekb: 1,
                        playsinline: 1,
                        enablejsapi: 1,
                    },
                    events: {
                        onReady: (e) => {
                            this.isReady = true;
                            if (this.callbacks.onReady) this.callbacks.onReady();
                        },
                        onStateChange: (e) => {
                            const S = YT.PlayerState;
                            if (e.data === S.PLAYING) {
                                if (this.callbacks.onPlay) this.callbacks.onPlay();
                            } else if (e.data === S.PAUSED) {
                                if (this.callbacks.onPause) this.callbacks.onPause();
                            } else if (e.data === S.ENDED) {
                                if (this.callbacks.onEnd) this.callbacks.onEnd();
                            } else if (e.data === S.BUFFERING) {
                                if (this.callbacks.onBuffering) this.callbacks.onBuffering();
                            }
                        },
                        onError: (e) => {
                            if (this.callbacks.onError) this.callbacks.onError(e.data);
                        }
                    }
                });
            }

            loadTrack(track, autoPlay = true) {
                if (!this.isReady || !this.player) return;
                const token = ++this.loadToken;
                this.currentVideoId = track.videoId;

                // Execute on next tick to prevent rapid click collision
                setTimeout(() => {
                    if (token !== this.loadToken) return; // Discard superseded requests
                    try {
                        if (autoPlay) {
                            this.player.loadVideoById({ videoId: track.videoId, startSeconds: 0 });
                            this.player.playVideo();
                        } else {
                            this.player.cueVideoById({ videoId: track.videoId, startSeconds: 0 });
                        }
                    } catch (err) {
                        console.error('YouTubeProvider error loading track:', err);
                    }
                }, 20);
            }

            play() {
                if (this.isReady && this.player) {
                    try { this.player.playVideo(); } catch (e) { }
                }
            }

            pause() {
                if (this.isReady && this.player) {
                    try { this.player.pauseVideo(); } catch (e) { }
                }
            }

            seek(seconds) {
                if (this.isReady && this.player) {
                    try { this.player.seekTo(seconds, true); } catch (e) { }
                }
            }

            setVolume(volume) {
                if (this.isReady && this.player) {
                    try { this.player.setVolume(Math.max(0, Math.min(100, volume))); } catch (e) { }
                }
            }

            getCurrentTime() {
                if (this.isReady && this.player && typeof this.player.getCurrentTime === 'function') {
                    try { return this.player.getCurrentTime() || 0; } catch (e) { }
                }
                return 0;
            }

            getDuration() {
                if (this.isReady && this.player && typeof this.player.getDuration === 'function') {
                    try { return this.player.getDuration() || 0; } catch (e) { }
                }
                return 0;
            }

            destroy() {
                if (this.player && typeof this.player.destroy === 'function') {
                    try { this.player.destroy(); } catch (e) { }
                }
                this.player = null;
                this.isReady = false;
            }
        }

        // ════════════════════════════════════════════════════════════════════════════
        // 3. CENTRAL PLAYER CONTROLLER
        // ════════════════════════════════════════════════════════════════════════════
        class PlayerController {
            constructor(playlist, provider) {
                this.playlist = playlist;
                this.provider = provider;
                this.currentIndex = 0;
                this.isPlaying = false;
                this.isReady = false;
                this.currentTime = 0;
                this.duration = 0;
                this.volume = 75;
                this.isSeeking = false;
                this.listeners = [];
                this.progressInterval = null;
                this.pendingAutoplay = false;

                this._initProvider();
            }

            _initProvider() {
                this.provider.init({
                    onReady: () => {
                        this.isReady = true;
                        this.provider.setVolume(this.volume);
                        if (this.pendingAutoplay) {
                            this.play();
                            this.pendingAutoplay = false;
                        }
                        this._notify('ready');
                    },
                    onPlay: () => {
                        this.isPlaying = true;
                        this._startProgressTracker();
                        this._notify('play');
                    },
                    onPause: () => {
                        this.isPlaying = false;
                        this._stopProgressTracker();
                        this._notify('pause');
                    },
                    onEnd: () => {
                        this.next(true);
                    },
                    onBuffering: () => {
                        this._notify('buffering');
                    },
                    onError: (errCode) => {
                        this._notify('error', errCode);
                        // Auto-skip after 1.5s on unplayable tracks
                        setTimeout(() => this.next(true), 1500);
                    }
                });
            }

            getCurrentTrack() {
                return this.playlist[this.currentIndex];
            }

            play() {
                if (!this.isReady) {
                    this.pendingAutoplay = true;
                    return;
                }
                this.isPlaying = true;
                this.provider.play();
                this._notify('play');
            }

            pause() {
                this.isPlaying = false;
                this.provider.pause();
                this._notify('pause');
            }

            togglePlay() {
                this.isPlaying ? this.pause() : this.play();
            }

            selectTrack(index, autoPlay = true) {
                this.currentIndex = ((index % this.playlist.length) + this.playlist.length) % this.playlist.length;
                this.currentTime = 0;
                this.duration = 0;
                const track = this.getCurrentTrack();
                if (autoPlay) this.isPlaying = true;
                this.provider.loadTrack(track, autoPlay);
                this._notify('trackChange', track);
            }

            next(autoPlay = true) {
                this.selectTrack(this.currentIndex + 1, autoPlay || this.isPlaying);
            }

            previous(autoPlay = true) {
                // Spotify-style previous: If > 3 seconds, restart current track from 0
                const curTime = this.provider.getCurrentTime();
                if (curTime > 3) {
                    this.provider.seek(0);
                    this.currentTime = 0;
                    this._notify('timeUpdate', { currentTime: 0, duration: this.duration });
                    return;
                }
                this.selectTrack(this.currentIndex - 1, autoPlay || this.isPlaying);
            }

            seek(seconds) {
                this.currentTime = seconds;
                this.provider.seek(seconds);
                this._notify('timeUpdate', { currentTime: seconds, duration: this.duration });
            }

            setVolume(volume) {
                this.volume = Math.max(0, Math.min(100, volume));
                this.provider.setVolume(this.volume);
                this._notify('volumeChange', this.volume);
            }

            _startProgressTracker() {
                if (this.progressInterval) return;
                const update = () => {
                    if (this.isPlaying && !this.isSeeking) {
                        this.currentTime = this.provider.getCurrentTime();
                        this.duration = this.provider.getDuration();
                        this._notify('timeUpdate', { currentTime: this.currentTime, duration: this.duration });
                    }
                    this.progressInterval = requestAnimationFrame(update);
                };
                this.progressInterval = requestAnimationFrame(update);
            }

            _stopProgressTracker() {
                if (this.progressInterval) {
                    cancelAnimationFrame(this.progressInterval);
                    this.progressInterval = null;
                }
            }

            subscribe(callback) {
                this.listeners.push(callback);
                return () => {
                    this.listeners = this.listeners.filter(l => l !== callback);
                };
            }

            _notify(event, data) {
                this.listeners.forEach(cb => cb(event, data, this));
            }
        }

        // ════════════════════════════════════════════════════════════════════════════
        // 4. UI TIME FORMATTING (Zero-NaN safety)
        // ════════════════════════════════════════════════════════════════════════════
        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) {
                return "0:00";
            }
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
        }

        // ════════════════════════════════════════════════════════════════════════════
        // 5. DARSH FM UI CONTROLLER & BINDINGS
        // ════════════════════════════════════════════════════════════════════════════
        const ytProvider = new YouTubeProvider();
        const playerController = new PlayerController(PLAYLIST, ytProvider);

        // DOM elements
        const playBtn        = document.getElementById('playBtn');
        const playLed        = document.getElementById('playLed');
        const playIcon       = playBtn.querySelector('.icon-play');
        const stopIcon       = playBtn.querySelector('.icon-stop');
        const lcdFreq        = document.getElementById('lcdFreq');
        const lcdMeta        = document.getElementById('lcdMeta');
        const lcdIdx         = document.getElementById('lcdIdx');
        const tunerIndicator = document.getElementById('tunerIndicator');
        const signalLeds     = document.getElementById('signalLeds');
        const volKnob        = document.getElementById('volKnob');
        const tuneKnob       = document.getElementById('tuneKnob');
        const progressFill   = document.getElementById('progressFill');
        const progressBg     = document.getElementById('progressBg');
        const progressTime   = document.getElementById('progressTime');
        const playlistTray   = document.getElementById('playlistTray');
        const trayHandle     = document.getElementById('trayHandle');
        const listBtn        = document.getElementById('listBtn');
        const lcdListBtn     = document.getElementById('lcdListBtn');
        const trackList      = document.getElementById('trackList');

        let vizRaf = null;
        let trayOpen = false;
        let volAngle = -100 + (playerController.volume / 100) * 200;
        let tuneAngle = 0;
        let draggingVol = false, volStartY = 0, volStartAngle = volAngle;
        let draggingTune = false, tuneStartY = 0, tuneStartAngle = 0;
        let tuneAccumPx = 0;
        const PX_PER_TRACK = 28;

        const stations = {
            '91.1':  { needle: 0.07  },
            '98.7':  { needle: 0.508 },
            '103.5': { needle: 0.756 },
            '107.2': { needle: 0.942 },
        };

        // Render Tracklist
        function renderPlaylist() {
            trackList.innerHTML = '';
            PLAYLIST.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = 'track-item' + (i === playerController.currentIndex ? ' active' : '');
                item.dataset.idx = i;
                item.setAttribute('role', 'listitem');
                item.setAttribute('tabindex', '0');
                item.setAttribute('aria-label', `${t.title} by ${t.artist}`);
                item.innerHTML = `
                    <span class="track-num">${String(i + 1).padStart(2, '0')}</span>
                    <div class="cd-disc" aria-hidden="true"></div>
                    <div class="track-info">
                        <div class="track-title">${t.title}</div>
                        <div class="track-artist">${t.artist}</div>
                    </div>
                    <span class="track-play-icon" aria-hidden="true">${i === playerController.currentIndex ? '▶' : ''}</span>`;
                
                const onSelect = () => playerController.selectTrack(i, true);
                item.addEventListener('click', onSelect);
                item.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        onSelect();
                    }
                });
                trackList.appendChild(item);
            });
        }

        function highlightActiveTrack(idx) {
            document.querySelectorAll('.track-item').forEach((el, i) => {
                const isActive = (i === idx);
                el.classList.toggle('active', isActive);
                const playIconSpan = el.querySelector('.track-play-icon');
                if (playIconSpan) playIconSpan.textContent = isActive ? '▶' : '';
            });
            const active = trackList.querySelector('.track-item.active');
            if (active && trayOpen) {
                active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        function updateLCD(track, idx) {
            lcdMeta.textContent = `${track.title} · ${track.artist}`;
            lcdIdx.textContent = `${String(idx + 1).padStart(2, '0')}/44`;
            lcdFreq.classList.add('flicker');
            setTimeout(() => lcdFreq.classList.remove('flicker'), 180);
        }

        function updatePlayState(isPlaying) {
            playIcon.style.display = isPlaying ? 'none' : '';
            stopIcon.style.display = isPlaying ? '' : 'none';
            playBtn.setAttribute('aria-label', isPlaying ? 'Pause Track' : 'Play Track');
            playBtn.setAttribute('aria-pressed', isPlaying ? 'true' : 'false');
            if (isPlaying) {
                playLed.classList.add('on');
                signalLeds.classList.add('active');
                startSignalViz();
            } else {
                playLed.classList.remove('on');
                signalLeds.classList.remove('active');
                stopSignalViz();
            }
        }

        // Subscribe to PlayerController events
        playerController.subscribe((event, data, ctrl) => {
            if (event === 'play') {
                updatePlayState(true);
            } else if (event === 'pause') {
                updatePlayState(false);
            } else if (event === 'trackChange') {
                updateLCD(data, ctrl.currentIndex);
                highlightActiveTrack(ctrl.currentIndex);
            } else if (event === 'timeUpdate') {
                const { currentTime, duration } = data;
                progressTime.textContent = formatTime(currentTime);
                if (duration > 0) {
                    const pct = Math.min(100, Math.max(0, (currentTime / duration) * 100));
                    progressFill.style.width = `${pct}%`;
                    progressBg.setAttribute('aria-valuenow', Math.round(pct));
                }
            } else if (event === 'error') {
                lcdMeta.textContent = "TRACK UNAVAILABLE · AUTO SKIPPING";
            }
        });

        // ════════════════════════════════════════════════════════════════════════════
        // 6. HARDWARE CONTROLS (Play, Progress, Knobs, Presets, Tray)
        // ════════════════════════════════════════════════════════════════════════════
        playBtn.addEventListener('click', () => {
            playBtn.classList.add('pressed');
            setTimeout(() => playBtn.classList.remove('pressed'), 130);
            playerController.togglePlay();
        });

        // Progress bar seeking
        function seekFromPointer(clientX) {
            const rect = progressBg.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            const dur = playerController.duration || playerController.provider.getDuration() || 0;
            if (dur > 0) {
                playerController.seek(pct * dur);
            }
        }

        progressBg.addEventListener('click', e => seekFromPointer(e.clientX));

        // Volume knob
        function setKnobRotation(el, deg) { el.style.transform = `rotate(${deg}deg)`; }
        setKnobRotation(volKnob, volAngle);
        setKnobRotation(tuneKnob, tuneAngle);

        function startVol(clientY) {
            draggingVol = true;
            volStartY = clientY;
            volStartAngle = volAngle;
            document.body.style.cursor = 'ns-resize';
        }
        function moveVol(clientY) {
            if (!draggingVol) return;
            const delta = (volStartY - clientY) * 1.5;
            volAngle = Math.max(-100, Math.min(100, volStartAngle + delta));
            const vol = Math.round((volAngle + 100) / 2);
            setKnobRotation(volKnob, volAngle);
            playerController.setVolume(vol);
        }
        function endVol() {
            if (draggingVol) { draggingVol = false; document.body.style.cursor = ''; }
        }

        volKnob.parentElement.addEventListener('mousedown', e => startVol(e.clientY));
        window.addEventListener('mousemove', e => moveVol(e.clientY));
        window.addEventListener('mouseup', endVol);
        volKnob.parentElement.addEventListener('touchstart', e => {
            if (e.touches.length) startVol(e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchmove', e => {
            if (draggingVol && e.touches.length) moveVol(e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchend', endVol);

        // Tuning knob
        function startTune(clientY) {
            draggingTune = true;
            tuneStartY = clientY;
            tuneStartAngle = tuneAngle;
            tuneAccumPx = 0;
            document.body.style.cursor = 'ns-resize';
        }
        function moveTune(clientY) {
            if (!draggingTune) return;
            const rawDeltaPx = tuneStartY - clientY;
            tuneAngle = tuneStartAngle + rawDeltaPx * 1.5;
            setKnobRotation(tuneKnob, tuneAngle);

            const raw = ((tuneAngle % 360) + 360) % 360;
            tunerIndicator.style.left = `${(raw / 360) * 100}%`;
            lcdFreq.textContent = (87.5 + (raw / 360) * (108 - 87.5)).toFixed(1);

            const steps = Math.floor(rawDeltaPx / PX_PER_TRACK);
            const needed = steps - Math.round(tuneAccumPx / PX_PER_TRACK);
            if (needed > 0) {
                playerController.next();
                tuneAccumPx += PX_PER_TRACK;
            } else if (needed < 0) {
                playerController.previous();
                tuneAccumPx -= PX_PER_TRACK;
            }
        }
        function endTune() {
            if (draggingTune) { draggingTune = false; document.body.style.cursor = ''; }
        }

        tuneKnob.parentElement.addEventListener('mousedown', e => startTune(e.clientY));
        window.addEventListener('mousemove', e => moveTune(e.clientY));
        window.addEventListener('mouseup', endTune);
        tuneKnob.parentElement.addEventListener('touchstart', e => {
            if (e.touches.length) startTune(e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchmove', e => {
            if (draggingTune && e.touches.length) moveTune(e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchend', endTune);

        // Station Presets
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.add('pressed');
                setTimeout(() => btn.classList.remove('pressed'), 120);
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const freq = btn.dataset.freq;
                const s = stations[freq];
                animateFreq(parseFloat(lcdFreq.textContent), parseFloat(freq));
                tunerIndicator.style.left = `${s.needle * 100}%`;
                tuneAngle = s.needle * 360;
                setKnobRotation(tuneKnob, tuneAngle);
                lcdFreq.classList.add('flicker');
                setTimeout(() => lcdFreq.classList.remove('flicker'), 180);
            });
        });
        tunerIndicator.style.left = `${stations['98.7'].needle * 100}%`;

        function animateFreq(from, to) {
            const dur = 350, start = performance.now();
            (function step(now) {
                const t = Math.min((now - start) / dur, 1);
                const e = 1 - Math.pow(1 - t, 3);
                lcdFreq.textContent = (from + (to - from) * e).toFixed(1);
                if (t < 1) requestAnimationFrame(step);
            })(performance.now());
        }

        // Toggle Playlist Drawer
        function toggleDrawer() {
            trayOpen = !trayOpen;
            playlistTray.classList.toggle('open', trayOpen);
            trayHandle.setAttribute('aria-expanded', trayOpen ? 'true' : 'false');
            if (listBtn) listBtn.classList.toggle('active', trayOpen);
            if (lcdListBtn) {
                lcdListBtn.classList.toggle('active', trayOpen);
                lcdListBtn.classList.add('pressed');
                setTimeout(() => lcdListBtn.classList.remove('pressed'), 120);
            }
            if (trayOpen) {
                setTimeout(() => {
                    const active = trackList.querySelector('.track-item.active');
                    if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }, 80);
            }
        }

        trayHandle.addEventListener('click', toggleDrawer);
        trayHandle.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleDrawer(); }
        });
        if (listBtn) listBtn.addEventListener('click', toggleDrawer);
        if (lcdListBtn) lcdListBtn.addEventListener('click', toggleDrawer);

        // LED Visualizer
        function startSignalViz() {
            if (vizRaf) return;
            (function frame() {
                const leds = document.querySelectorAll('.signal-leds span');
                const count = leds.length;
                const t = performance.now() / 1000;
                const amp = Math.sin(t * 3.1) * 0.35 + Math.sin(t * 7.3) * 0.2 + 0.6;
                const active = Math.round(amp * count);
                leds.forEach((s, i) => {
                    s.classList.toggle('lit', i < active);
                    s.classList.toggle('peak', i === count - 1 && active === count);
                });
                vizRaf = requestAnimationFrame(frame);
            })();
        }
        function stopSignalViz() {
            if (vizRaf) { cancelAnimationFrame(vizRaf); vizRaf = null; }
            document.querySelectorAll('.signal-leds span').forEach(s => s.classList.remove('lit', 'peak'));
        }

        // ════════════════════════════════════════════════════════════════════════════
        // 7. INITIALIZE APP
        // ════════════════════════════════════════════════════════════════════════════
        renderPlaylist();
        const initialTrack = playerController.getCurrentTrack();
        lcdMeta.textContent = `${initialTrack.title} · ${initialTrack.artist}`;
        lcdIdx.textContent = `01/44`;

        // Ambient background video loop (0.35x playback speed)
        const bgVideo = document.querySelector('.bg-video');
        if (bgVideo) {
            bgVideo.playbackRate = 0.35;
            bgVideo.addEventListener('loadedmetadata', () => { bgVideo.playbackRate = 0.35; });
            bgVideo.addEventListener('play', () => { bgVideo.playbackRate = 0.35; });
        }

        // Smooth radio body entrance animation
        const radioBodyEl = document.querySelector('.radio-body');
        if (radioBodyEl) {
            radioBodyEl.animate([
                { opacity: 0, transform: 'translateY(40px) scale(0.97)' },
                { opacity: 1, transform: 'translateY(0) scale(1)' }
            ], { duration: 650, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' });
        }
    </script>
</body>

</html>
