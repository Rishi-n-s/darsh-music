    // 2. HYBRID UNIVERSAL MEDIA PROVIDER (Seamless Local + YouTube Fallback)
    // ════════════════════════════════════════════════════════════════════════════
    class HybridMediaProvider {
      constructor() {
        this.mode = 'local'; // 'local' | 'youtube'
        this.localMedia = null;
        this.ytPlayer = null;
        this.isReady = false;
        this.callbacks = {};
        this.currentTrack = null;
        this.loadToken = 0;
        this.volume = 80;
        this.ytReady = false;
      }

      init(callbacks) {
        this.callbacks = callbacks;
        this.localMedia = document.getElementById('radioVideo');

        // Setup Local Media events
        if (this.localMedia) {
          this.localMedia.addEventListener('canplay', () => {
            if (this.mode === 'local') {
              this.isReady = true;
              if (this.callbacks.onReady) this.callbacks.onReady();
            }
          });

          this.localMedia.addEventListener('play', () => {
            if (this.mode === 'local' && this.callbacks.onPlay) this.callbacks.onPlay();
          });

          this.localMedia.addEventListener('pause', () => {
            if (this.mode === 'local' && this.callbacks.onPause) this.callbacks.onPause();
          });

          this.localMedia.addEventListener('ended', () => {
            if (this.mode === 'local' && this.callbacks.onEnd) this.callbacks.onEnd();
          });

          this.localMedia.addEventListener('waiting', () => {
            if (this.mode === 'local' && this.callbacks.onBuffering) this.callbacks.onBuffering();
          });

          this.localMedia.addEventListener('error', (e) => {
            console.warn('Local media file error/pointer detected, falling back to YouTube streaming:', e);
            this._fallbackToYouTube(true);
          });
        }

        // Setup YouTube API
        const createYT = () => {
          if (this.ytPlayer) return;
          try {
            this.ytPlayer = new YT.Player('yt-player', {
              height: '100%',
              width: '100%',
              videoId: PLAYLIST[0].videoId,
              playerVars: {
                autoplay: 0,
                controls: 0,
                rel: 0,
                modestbranding: 1,
                iv_load_policy: 3,
                disablekb: 1,
                playsinline: 1,
                enablejsapi: 1,
                origin: window.location.origin
              },
              events: {
                onReady: () => {
                  this.ytReady = true;
                  if (this.ytPlayer && typeof this.ytPlayer.setVolume === 'function') {
                    this.ytPlayer.setVolume(this.volume);
                  }
                  if (this.mode === 'youtube' && this.callbacks.onReady) {
                    this.callbacks.onReady();
                  }
                },
                onStateChange: (e) => {
                  if (this.mode !== 'youtube') return;
                  const S = YT.PlayerState;
                  if (e.data === S.PLAYING && this.callbacks.onPlay) this.callbacks.onPlay();
                  if (e.data === S.PAUSED && this.callbacks.onPause) this.callbacks.onPause();
                  if (e.data === S.ENDED && this.callbacks.onEnd) this.callbacks.onEnd();
                  if (e.data === S.BUFFERING && this.callbacks.onBuffering) this.callbacks.onBuffering();
                },
                onError: (err) => {
                  console.warn('YouTube streaming event:', err);
                }
              }
            });
          } catch (err) {
            console.warn('YouTube initialization error:', err);
          }
        };

        if (window.YT && window.YT.Player) {
          createYT();
        } else {
          window.onYouTubeIframeAPIReady = createYT;
        }

        this.isReady = true;
        if (this.callbacks.onReady) this.callbacks.onReady();
      }

      loadTrack(track, autoPlay = true) {
        this.currentTrack = track;
        const token = ++this.loadToken;

        if (this.mode === 'youtube') {
          this._loadYouTubeTrack(track, autoPlay);
          return;
        }

        if (this.localMedia && track.src) {
          this.localMedia.src = track.src;
          this.localMedia.load();
          if (autoPlay) {
            const playPromise = this.localMedia.play();
            if (playPromise && typeof playPromise.catch === 'function') {
              playPromise.catch(e => {
                console.warn('Local play error, switching to YouTube stream:', e);
                if (token === this.loadToken) {
                  this._fallbackToYouTube(autoPlay);
                }
              });
            }
          }
        } else {
          this._fallbackToYouTube(autoPlay);
        }
      }

      _fallbackToYouTube(autoPlay = true) {
        this.mode = 'youtube';
        const wrap = document.getElementById('yt-player-wrap');
        if (wrap) wrap.style.display = 'block';
        if (this.localMedia) {
          this.localMedia.pause();
          this.localMedia.style.display = 'none';
        }
        if (this.currentTrack) {
          this._loadYouTubeTrack(this.currentTrack, autoPlay);
        }
      }

      _loadYouTubeTrack(track, autoPlay) {
        const wrap = document.getElementById('yt-player-wrap');
        if (wrap) wrap.style.display = 'block';
        if (this.localMedia) this.localMedia.style.display = 'none';

        if (this.ytPlayer && typeof this.ytPlayer.loadVideoById === 'function') {
          if (autoPlay) {
            this.ytPlayer.loadVideoById(track.videoId);
          } else {
            this.ytPlayer.cueVideoById(track.videoId);
          }
          this.ytPlayer.setVolume(this.volume);
        } else {
          // If YT is still loading, wait a moment and retry
          setTimeout(() => {
            if (this.ytPlayer && typeof this.ytPlayer.loadVideoById === 'function') {
              if (autoPlay) this.ytPlayer.loadVideoById(track.videoId);
              else this.ytPlayer.cueVideoById(track.videoId);
              this.ytPlayer.setVolume(this.volume);
            }
          }, 300);
        }
      }

      play() {
        if (this.mode === 'youtube') {
          if (this.ytPlayer && typeof this.ytPlayer.playVideo === 'function') {
            this.ytPlayer.playVideo();
          }
        } else {
          if (this.localMedia) {
            this.localMedia.play().catch(() => this._fallbackToYouTube(true));
          }
        }
      }

      pause() {
        if (this.mode === 'youtube') {
          if (this.ytPlayer && typeof this.ytPlayer.pauseVideo === 'function') {
            this.ytPlayer.pauseVideo();
          }
        } else {
          if (this.localMedia) this.localMedia.pause();
        }
      }

      seek(seconds) {
        if (this.mode === 'youtube') {
          if (this.ytPlayer && typeof this.ytPlayer.seekTo === 'function') {
            this.ytPlayer.seekTo(seconds, true);
          }
        } else {
          if (this.localMedia && Number.isFinite(seconds)) {
            this.localMedia.currentTime = seconds;
          }
        }
      }

      setVolume(volume) {
        this.volume = Math.max(0, Math.min(100, volume));
        if (this.ytPlayer && typeof this.ytPlayer.setVolume === 'function') {
          this.ytPlayer.setVolume(this.volume);
        }
        if (this.localMedia) {
          this.localMedia.volume = Math.max(0, Math.min(1, this.volume / 100));
        }
      }

      getCurrentTime() {
        if (this.mode === 'youtube') {
          return (this.ytPlayer && typeof this.ytPlayer.getCurrentTime === 'function') ? (this.ytPlayer.getCurrentTime() || 0) : 0;
        }
        return this.localMedia ? (this.localMedia.currentTime || 0) : 0;
      }

      getDuration() {
        if (this.mode === 'youtube') {
          return (this.ytPlayer && typeof this.ytPlayer.getDuration === 'function') ? (this.ytPlayer.getDuration() || 0) : 0;
        }
        return this.localMedia ? (this.localMedia.duration || 0) : 0;
      }
    }

    // ════════════════════════════════════════════════════════════════════════════
    // 3. CENTRAL PLAYER CONTROLLER
    // ════════════════════════════════════════════════════════════════════════════
    class PlayerController {
      constructor(playlist, provider) {
        this.playlist = playlist;
        this.provider = provider;
        this.currentIndex = 0;
        this.isPlaying = false;
        this.isReady = false;
        this.currentTime = 0;
        this.duration = 0;
        this.volume = 80;
        this.isSeeking = false;
        this.isLoopMode = false;
        this.listeners = [];
        this.progressInterval = null;
        this.pendingAutoplay = false;

        this._initProvider();
      }

      _initProvider() {
        this.provider.init({
          onReady: () => {
            this.isReady = true;
            this.provider.setVolume(this.volume);
            if (this.pendingAutoplay) {
              this.play();
              this.pendingAutoplay = false;
            }
            this._notify('ready');
          },
          onPlay: () => {
            this.isPlaying = true;
            this._startProgressTracker();
            this._notify('play');
          },
          onPause: () => {
            this.isPlaying = false;
            this._stopProgressTracker();
            this._notify('pause');
          },
          onEnd: () => {
            if (this.isLoopMode) {
              this.selectTrack(this.currentIndex, true);
            } else {
              this.next(true);
            }
          },
          onBuffering: () => {
            this._notify('buffering');
          },
          onError: (errCode) => {
            this._notify('error', errCode);
          }
        });
      }

      getCurrentTrack() {
        return this.playlist[this.currentIndex];
      }

      play() {
        if (!this.isReady) {
          this.pendingAutoplay = true;
          return;
        }
        this.isPlaying = true;
        this.provider.play();
        this._notify('play');
      }

      pause() {
        this.isPlaying = false;
        this.provider.pause();
        this._notify('pause');
      }

      togglePlay() {
        this.isPlaying ? this.pause() : this.play();
      }

      selectTrack(index, autoPlay = true) {
        this.currentIndex = ((index % this.playlist.length) + this.playlist.length) % this.playlist.length;
        this.currentTime = 0;
        this.duration = 0;
        const track = this.getCurrentTrack();
        if (autoPlay) this.isPlaying = true;
        this.provider.loadTrack(track, autoPlay);
        this._notify('trackChange', track);
      }

      next(autoPlay = true) {
        this.selectTrack(this.currentIndex + 1, autoPlay || this.isPlaying);
      }

      previous(autoPlay = true) {
        const curTime = this.provider.getCurrentTime();
        if (curTime > 3) {
          this.provider.seek(0);
          this.currentTime = 0;
          this._notify('timeUpdate', { currentTime: 0, duration: this.duration });
          return;
        }
        this.selectTrack(this.currentIndex - 1, autoPlay || this.isPlaying);
      }

      seek(seconds) {
        this.currentTime = seconds;
        this.provider.seek(seconds);
        this._notify('timeUpdate', { currentTime: seconds, duration: this.duration });
      }

      setVolume(volume) {
        this.volume = Math.max(0, Math.min(100, volume));
        this.provider.setVolume(this.volume);
        this._notify('volumeChange', this.volume);
      }

      _startProgressTracker() {
        this._stopProgressTracker();
        const update = () => {
          if (this.isPlaying && !this.isSeeking) {
            this.currentTime = this.provider.getCurrentTime();
            this.duration = this.provider.getDuration();
            this._notify('timeUpdate', { currentTime: this.currentTime, duration: this.duration });
          }
          this.progressInterval = requestAnimationFrame(update);
        };
        this.progressInterval = requestAnimationFrame(update);
      }

      _stopProgressTracker() {
        if (this.progressInterval) {
          cancelAnimationFrame(this.progressInterval);
          this.progressInterval = null;
        }
      }

      subscribe(callback) {
        this.listeners.push(callback);
        return () => {
          this.listeners = this.listeners.filter(l => l !== callback);
        };
      }

      _notify(event, data) {
        this.listeners.forEach(cb => cb(event, data, this));
      }
    }

    // ════════════════════════════════════════════════════════════════════════════
    // 4. UI TIME FORMATTING
    // ════════════════════════════════════════════════════════════════════════════
    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) {
        return "0:00";
      }
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.floor(seconds % 60);
      return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
    }

    // ════════════════════════════════════════════════════════════════════════════
    // 5. DARSH FM UI CONTROLLER & BINDINGS
    // ════════════════════════════════════════════════════════════════════════════
    const mediaProvider = new HybridMediaProvider();
    const playerController = new PlayerController(PLAYLIST, mediaProvider);

    // DOM elements
    const playBtn = document.getElementById('playBtn');
    const playLed = document.getElementById('playLed');
    const playIcon = playBtn.querySelector('.icon-play');
    const stopIcon = playBtn.querySelector('.icon-stop');
    const lcdFreq = document.getElementById('lcdFreq');
    const lcdMeta = document.getElementById('lcdMeta');
    const lcdIdx = document.getElementById('lcdIdx');
    const tunerIndicator = document.getElementById('tunerIndicator');
    const signalLeds = document.getElementById('signalLeds');
    const volKnob = document.getElementById('volKnob');
    const tuneKnob = document.getElementById('tuneKnob');
    const progressFill = document.getElementById('progressFill');
    const progressBg = document.getElementById('progressBg');
    const progressTime = document.getElementById('progressTime');
    const playlistTray = document.getElementById('playlistTray');
    const trayHandle = document.getElementById('trayHandle');
    const lcdListBtn = document.getElementById('lcdListBtn');
    const trackList = document.getElementById('trackList');

    // Deck Buttons: PREV, PLAY, STOP, NEXT, LOOP
    const btnPrev = document.getElementById('btnPrev');
    const btnPlay = document.getElementById('btnPlay');
    const btnStop = document.getElementById('btnStop');
    const btnNext = document.getElementById('btnNext');
    const btnLoop = document.getElementById('btnLoop');

    let trayOpen = false;
    let vizRaf = null;
    let volAngle = -100 + (playerController.volume / 100) * 200;
    let tuneAngle = 0;
    let draggingVol = false, volStartY = 0, volStartAngle = volAngle;
    let draggingTune = false, tuneStartY = 0, tuneStartAngle = 0;
    let tuneAccumPx = 0;
    const PX_PER_TRACK = 28;

    // Render Playlist
    function renderPlaylist() {
      trackList.innerHTML = '';
      PLAYLIST.forEach((track, i) => {
        const item = document.createElement('div');
        const isCurrent = i === playerController.currentIndex;
        item.className = 'track-item' + (isCurrent ? ' active' : '');
        item.setAttribute('role', 'listitem');
        item.setAttribute('tabindex', '0');
        item.setAttribute('aria-label', `Track ${i + 1}: ${track.title} by ${track.artist}`);
        item.innerHTML = `
          <span class="track-num">${String(i + 1).padStart(2, '0')}</span>
          <div class="cd-disc" aria-hidden="true"></div>
          <div class="track-info">
            <div class="track-title">${track.title}</div>
            <div class="track-artist">${track.artist}</div>
          </div>
          <span class="track-play-icon" aria-hidden="true">
            ${isCurrent && playerController.isPlaying ? `
              <svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
              </svg>
            ` : '·'}
          </span>
        `;
        item.addEventListener('click', () => {
          playerController.selectTrack(i, true);
        });
        item.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            playerController.selectTrack(i, true);
          }
        });
        trackList.appendChild(item);
      });
    }

    function updateLCD(track, idx) {
      lcdMeta.textContent = `${track.title} · ${track.artist}`;
      lcdIdx.textContent = `${String(idx + 1).padStart(2, '0')}/39`;
      lcdFreq.classList.add('flicker');
      setTimeout(() => lcdFreq.classList.remove('flicker'), 180);

      // Update active state in playlist tray
      const items = trackList.querySelectorAll('.track-item');
      items.forEach((item, i) => {
        const isCurrent = i === idx;
        item.classList.toggle('active', isCurrent);
        const icon = item.querySelector('.track-play-icon');
        if (icon) {
          icon.innerHTML = isCurrent && playerController.isPlaying ? `
            <svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          ` : '·';
        }
      });
    }

    function updatePlayState(isPlaying) {
      playIcon.style.display = isPlaying ? 'none' : '';
      stopIcon.style.display = isPlaying ? '' : 'none';
      playBtn.setAttribute('aria-label', isPlaying ? 'Pause Track' : 'Play Track');
      playBtn.setAttribute('aria-pressed', isPlaying ? 'true' : 'false');

      // Highlight deck PLAY / STOP buttons
      if (btnPlay) btnPlay.classList.toggle('active', isPlaying);
      if (btnStop) btnStop.classList.toggle('active', !isPlaying);

      if (isPlaying) {
        playLed.classList.add('on');
        signalLeds.classList.add('active');
        startSignalViz();
      } else {
        playLed.classList.remove('on');
        signalLeds.classList.remove('active');
        stopSignalViz();
      }

      // Update active icon in playlist tray
      const activeIcon = trackList.querySelector('.track-item.active .track-play-icon');
      if (activeIcon) {
        activeIcon.innerHTML = isPlaying ? `
          <svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        ` : '·';
      }
    }

    // Subscribe to PlayerController events
    playerController.subscribe((event, data, ctrl) => {
      if (event === 'play') {
        updatePlayState(true);
      } else if (event === 'pause') {
        updatePlayState(false);
      } else if (event === 'trackChange') {
        updateLCD(data, ctrl.currentIndex);
      } else if (event === 'timeUpdate') {
        const { currentTime, duration } = data;
        progressTime.textContent = formatTime(currentTime);
        if (duration > 0) {
          const pct = Math.min(100, Math.max(0, (currentTime / duration) * 100));
          progressFill.style.width = `${pct}%`;
          progressBg.setAttribute('aria-valuenow', Math.round(pct));
        }
      } else if (event === 'error') {
        lcdMeta.textContent = "TRACK UNAVAILABLE · AUTO SKIPPING";
      }
    });

    // ════════════════════════════════════════════════════════════════════════════
    // 6. HARDWARE CONTROLS & BINDINGS
    // ════════════════════════════════════════════════════════════════════════════
    playBtn.addEventListener('click', () => {
      playBtn.classList.add('pressed');
      setTimeout(() => playBtn.classList.remove('pressed'), 130);
      playerController.togglePlay();
    });

    // Deck Mechanical Buttons: PREV, PLAY, STOP, NEXT, LOOP
    if (btnPrev) {
      btnPrev.addEventListener('click', () => {
        btnPrev.classList.add('pressed');
        setTimeout(() => btnPrev.classList.remove('pressed'), 120);
        playerController.previous();
      });
    }

    if (btnPlay) {
      btnPlay.addEventListener('click', () => {
        btnPlay.classList.add('pressed');
        setTimeout(() => btnPlay.classList.remove('pressed'), 120);
        playerController.play();
      });
    }

    if (btnStop) {
      btnStop.addEventListener('click', () => {
        btnStop.classList.add('pressed');
        setTimeout(() => btnStop.classList.remove('pressed'), 120);
        playerController.pause();
      });
    }

    if (btnNext) {
      btnNext.addEventListener('click', () => {
        btnNext.classList.add('pressed');
        setTimeout(() => btnNext.classList.remove('pressed'), 120);
        playerController.next();
      });
    }

    if (btnLoop) {
      btnLoop.addEventListener('click', () => {
        btnLoop.classList.add('pressed');
        setTimeout(() => btnLoop.classList.remove('pressed'), 120);
        playerController.isLoopMode = !playerController.isLoopMode;
        btnLoop.classList.toggle('active', playerController.isLoopMode);
      });
    }

    // Progress bar seeking
    function seekFromPointer(clientX) {
      const rect = progressBg.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const dur = playerController.duration || playerController.provider.getDuration() || 0;
      if (dur > 0) {
        playerController.seek(pct * dur);
      }
    }

    progressBg.addEventListener('click', e => seekFromPointer(e.clientX));

    // Volume knob
    function setKnobRotation(el, deg) { el.style.transform = `rotate(${deg}deg)`; }
    setKnobRotation(volKnob, volAngle);
    setKnobRotation(tuneKnob, tuneAngle);

    function startVol(clientY) {
      draggingVol = true;
      volStartY = clientY;
      volStartAngle = volAngle;
      document.body.style.cursor = 'ns-resize';
    }
    function moveVol(clientY) {
      if (!draggingVol) return;
      const delta = (volStartY - clientY) * 1.5;
      volAngle = Math.max(-100, Math.min(100, volStartAngle + delta));
      const vol = Math.round((volAngle + 100) / 2);
      setKnobRotation(volKnob, volAngle);
      playerController.setVolume(vol);
    }
    function endVol() {
      if (draggingVol) { draggingVol = false; document.body.style.cursor = ''; }
    }

    volKnob.parentElement.addEventListener('mousedown', e => startVol(e.clientY));
    window.addEventListener('mousemove', e => moveVol(e.clientY));
    window.addEventListener('mouseup', endVol);
    volKnob.parentElement.addEventListener('touchstart', e => {
      if (e.touches.length) startVol(e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchmove', e => {
      if (draggingVol && e.touches.length) moveVol(e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchend', endVol);

    // Tuning knob
    function startTune(clientY) {
      draggingTune = true;
      tuneStartY = clientY;
      tuneStartAngle = tuneAngle;
      tuneAccumPx = 0;
      document.body.style.cursor = 'ns-resize';
    }
    function moveTune(clientY) {
      if (!draggingTune) return;
      const rawDeltaPx = tuneStartY - clientY;
      tuneAngle = tuneStartAngle + rawDeltaPx * 1.5;
      setKnobRotation(tuneKnob, tuneAngle);

      const raw = ((tuneAngle % 360) + 360) % 360;
      tunerIndicator.style.left = `${(raw / 360) * 100}%`;
      lcdFreq.textContent = (87.5 + (raw / 360) * (108 - 87.5)).toFixed(1);

      const steps = Math.floor(rawDeltaPx / PX_PER_TRACK);
      const needed = steps - Math.round(tuneAccumPx / PX_PER_TRACK);
      if (needed > 0) {
        playerController.next();
        tuneAccumPx += PX_PER_TRACK;
      } else if (needed < 0) {
        playerController.previous();
        tuneAccumPx -= PX_PER_TRACK;
      }
    }
    function endTune() {
      if (draggingTune) { draggingTune = false; document.body.style.cursor = ''; }
    }

    tuneKnob.parentElement.addEventListener('mousedown', e => startTune(e.clientY));
    window.addEventListener('mousemove', e => moveTune(e.clientY));
    window.addEventListener('mouseup', endTune);
    tuneKnob.parentElement.addEventListener('touchstart', e => {
      if (e.touches.length) startTune(e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchmove', e => {
      if (draggingTune && e.touches.length) moveTune(e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchend', endTune);

    // Toggle Playlist Drawer
    function toggleDrawer() {
      trayOpen = !trayOpen;
      playlistTray.classList.toggle('open', trayOpen);
      trayHandle.setAttribute('aria-expanded', trayOpen ? 'true' : 'false');
      if (lcdListBtn) {
        lcdListBtn.classList.toggle('active', trayOpen);
        lcdListBtn.classList.add('pressed');
        setTimeout(() => lcdListBtn.classList.remove('pressed'), 120);
      }
      if (trayOpen) {
        setTimeout(() => {
          const active = trackList.querySelector('.track-item.active');
          if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }, 80);
      }
    }

    trayHandle.addEventListener('click', toggleDrawer);
    trayHandle.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleDrawer(); }
    });
    if (lcdListBtn) lcdListBtn.addEventListener('click', toggleDrawer);

    const mobilePlaylistToggle = document.getElementById('mobilePlaylistToggle');
    if (mobilePlaylistToggle) {
      mobilePlaylistToggle.addEventListener('click', () => {
        mobilePlaylistToggle.classList.add('pressed');
        setTimeout(() => mobilePlaylistToggle.classList.remove('pressed'), 120);
        toggleDrawer();
      });
    }

    const mobileTrayClose = document.getElementById('mobileTrayClose');
    if (mobileTrayClose) {
      mobileTrayClose.addEventListener('click', toggleDrawer);
    }

    // LED Visualizer
    function startSignalViz() {
      if (vizRaf) return;
      (function frame() {
        const leds = document.querySelectorAll('.signal-leds span');
        const count = leds.length;
        const t = performance.now() / 1000;
        const amp = Math.sin(t * 3.1) * 0.35 + Math.sin(t * 7.3) * 0.2 + 0.6;
        const active = Math.round(amp * count);
        leds.forEach((s, i) => {
          s.classList.toggle('lit', i < active);
          s.classList.toggle('peak', i === count - 1 && active === count);
        });
        vizRaf = requestAnimationFrame(frame);
      })();
    }
    function stopSignalViz() {
      if (vizRaf) { cancelAnimationFrame(vizRaf); vizRaf = null; }
      document.querySelectorAll('.signal-leds span').forEach(s => s.classList.remove('lit', 'peak'));
    }

    // ════════════════════════════════════════════════════════════════════════════
    // 7. INITIALIZE APP
    // ════════════════════════════════════════════════════════════════════════════
    renderPlaylist();
    playerController.selectTrack(0, false);
    const initialTrack = playerController.getCurrentTrack();
    lcdMeta.textContent = `${initialTrack.title} · ${initialTrack.artist}`;
    lcdIdx.textContent = `01/39`;

    // Ambient background video loop — smooth and relaxed 0.75x speed
    const bgVideo = document.querySelector('.bg-video');
    if (bgVideo) {
      bgVideo.muted = true;
      bgVideo.defaultPlaybackRate = 0.75;
      bgVideo.playbackRate = 0.75;
      const playBg = () => {
        bgVideo.playbackRate = 0.75;
        bgVideo.play().catch(() => {});
      };
      playBg();
      bgVideo.addEventListener('loadedmetadata', playBg);
      window.addEventListener('touchstart', playBg, { once: true });
      window.addEventListener('click', playBg, { once: true });
    }
    const radioBodyEl = document.querySelector('.radio-body');
    if (radioBodyEl) {
      radioBodyEl.animate([
        { opacity: 0, transform: 'translateY(40px) scale(0.97)' },
        { opacity: 1, transform: 'translateY(0) scale(1)' }
      ], { duration: 650, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' });
    }



</script>
